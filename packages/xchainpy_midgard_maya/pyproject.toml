[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xchainpy2-midgard-maya"
version = "2.16.0"
description = "Midgard Public API"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    { email = "devs@mayaprotocol.com" },
]
keywords = ["Swagger", "Midgard Public API"]
dependencies = [
    "aiohttp",
    "certifi",
    "python-dateutil",
    "six>=1.10",
    "urllib3>=1.15",
]

[project.optional-dependencies]
test = [
    "pluggy>=0.3.1",
    "py>=1.4.31",
    "pytest>=3.3.1",
    "pytest-cov>=2.5.1",
    "randomize>=0.13",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["xchainpy2_midgard_maya*"]
