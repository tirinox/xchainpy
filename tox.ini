[tox]
envlist = py39, py310, py311

[testenv]
deps =
    pytest
    pytest-asyncio
    packages/xchainpy_utils
    packages/xchainpy_client
    packages/xchainpy_crypto

    packages/xchainpy_midgard
    packages/xchainpy_mayanode
    packages/xchainpy_thornode

    packages/xchainpy_arbitrum
    packages/xchainpy_avalanche
    packages/xchainpy_bitcoin
    packages/xchainpy_bitcoincash
    packages/xchainpy_bsc
    packages/xchainpy_cosmos
    packages/xchainpy_dogecoin
    packages/xchainpy_ethereum
    packages/xchainpy_litecoin
    packages/xchainpy_mayachain
    packages/xchainpy_thorchain
    packages/xchainpy_base
    packages/xchainpy_wallet

    packages/xchainpy_thorchain_amm
    packages/xchainpy_thorchain_query
commands =
    pytest packages/xchainpy_client packages/xchainpy_cosmos packages/xchainpy_crypto packages/xchainpy_thorchain packages/xchainpy_thorchain_amm packages/xchainpy_thorchain_query packages/xchainpy_utils packages/xchainpy_bitcoin packages/xchainpy_bitcoincash packages/xchainpy_dogecoin packages/xchainpy_litecoin packages/xchainpy_mayachain packages/xchainpy_bsc packages/xchainpy_avalanche packages/xchainpy_arbitrum packages/xchainpy_base packages/xchainpy_wallet
